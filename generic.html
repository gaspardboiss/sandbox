<!DOCTYPE HTML>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="description" content="À propos de Gaspard Boissinot : étudiant en audiovisuel, réalisateur, monteur et photographe.">
    <title>À propos — Gaspard Boissinot</title>
    <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090a0f">
    <link rel="apple-touch-icon" href="images/icon-192.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CONSTANTES & DIRECTION ARTISTIQUE --- */
        :root {
            --bg-main: #090a0f;
            --bg-card: #12141c;
            --bg-nav: rgba(9, 10, 15, 0.9);
            --text-primary: #ffffff;
            --text-muted: #8c95a1;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        /* --- HERO HEADER MINIMALISTE SANS IMAGE DE FOND --- */
        .hero-about {
            position: relative;
            height: 35vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border-subtle);
        }

        .hero-content {
            position: relative;
            z-index: 3;
            padding: 0 20px;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .hero-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 4px;
            font-weight: 400;
            text-transform: uppercase;
        }

        /* --- NAVBAR CENTRAGE ABSOLU --- */
        .navbar {
            position: sticky;
            top: 0;
            background: var(--bg-nav);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 6%;
            position: relative;
        }

        .nav-brand {
            font-weight: 600;
            letter-spacing: 3px;
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--text-primary);
            z-index: 2;
        }

        .nav-links { 
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex; 
            gap: 40px; 
            list-style: none; 
            z-index: 2;
        }

        .nav-links a { 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: var(--text-muted); 
            transition: color 0.3s; 
            font-weight: 500; 
        }

        .nav-links a.active, .nav-links a:hover { 
            color: #ffffff; 
        }

        .nav-socials { 
            display: flex; 
            gap: 24px; 
            z-index: 2;
        }

        .nav-socials a { 
            color: var(--text-muted); 
            font-size: 1.1rem; 
            transition: color 0.3s, transform 0.3s; 
        }

        .nav-socials a:hover { 
            color: #ffffff; 
            transform: translateY(-2px); 
        }

        /* --- CONTENEUR ÉDITORIAL --- */
        .about-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 90px 30px;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 60px;
            align-items: center;
            margin-bottom: 70px;
        }

        .about-img-box {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            aspect-ratio: 4/5;
        }

        .about-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
            transition: transform 0.6s ease;
        }

        .about-img-box:hover img {
            transform: scale(1.03);
            filter: brightness(1);
        }

        .about-intro h2 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #fff;
        }

        .about-intro p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .about-story {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 60px;
            margin-bottom: 50px;
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .story-text p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 22px;
            line-height: 1.8;
        }

        .story-text p:last-child {
            margin-bottom: 0;
        }

        .story-img-box {
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            aspect-ratio: 4/5;
        }

        .story-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
            transition: transform 0.6s ease;
        }

        .story-img-box:hover img {
            transform: scale(1.03);
            filter: brightness(1);
        }

        .about-full-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 60px;
        }

        .about-full-card p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .about-full-card p:last-child {
            margin-bottom: 0;
        }

        /* --- FOOTER MINIMALISTE --- */
        .footer { 
            background: #06070a; 
            border-top: 1px solid var(--border-subtle); 
            padding: 100px 30px 50px; 
            margin-top: 100px; 
        }
        
        .footer-grid { 
            max-width: 1000px; 
            margin: 0 auto; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 80px; 
        }

        .contact-form input, .contact-form textarea { 
            width: 100%; 
            background: #11131a; 
            border: 1px solid var(--border-subtle); 
            padding: 16px 20px; 
            color: #fff; 
            border-radius: 4px; 
            margin-bottom: 20px; 
            font-family: inherit; 
            font-size: 0.9rem;
            transition: border-color 0.3s; 
        }
        
        .contact-form input:focus, .contact-form textarea:focus { 
            outline: none; 
            border-color: #ffffff; 
        }

        .submit-btn { 
            background: #ffffff; 
            color: #000000; 
            border: none; 
            padding: 15px 35px; 
            border-radius: 4px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            cursor: pointer; 
            font-size: 0.8rem;
            transition: background 0.3s; 
        }
        
        .submit-btn:hover { background: #dcdcdc; }

        .contact-info p { 
            margin-bottom: 25px; 
            color: var(--text-muted); 
            font-size: 0.95rem; 
        }
        
        .contact-info a { 
            color: #ffffff; 
            transition: color 0.3s; 
        }
        
        .contact-info a:hover { color: var(--text-muted); }

        .copyright { 
            text-align: center; 
            margin-top: 80px; 
            color: #555; 
            font-size: 0.8rem; 
            letter-spacing: 1px;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            .about-grid, .about-story {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 40px 25px;
            }
            .hero-title { font-size: 2.2rem; }
            .footer-grid { grid-template-columns: 1fr; gap: 40px; }
            .navbar { padding: 15px 20px; display: flex; justify-content: space-between; }
            .nav-brand { display: none; }
            .nav-links { position: static; transform: none; gap: 20px; }
            .about-full-card { padding: 40px 25px; }
        }
    </style>
</head>
