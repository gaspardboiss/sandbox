<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Contemporain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Couleurs douces qui ne fatiguent pas les yeux */
            --bg-color: #f4f3ef;
            --text-main: #2a2a2a;
            --text-muted: #6b6b6b;
            --accent: #d8d3c8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            background-image: radial-gradient(var(--accent) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- HEADER & HERO --- */
        header {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.1;
            transform: translateY(50px);
            opacity: 0;
            animation: fadeUp 1.2s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        .hero-title i {
            font-style: italic;
            color: var(--text-muted);
        }

        .hero-subtitle {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 1.2s cubic-bezier(0.165, 0.84, 0.44, 1) 0.3s forwards;
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- GRILLE ASYMÉTRIQUE & DYNAMIQUE --- */
        .portfolio-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 5vw;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 3vw;
        }

        .card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transform: translateY(100px);
            opacity: 0;
            transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Variations de la grille pour briser l'uniformité */
        .card:nth-child(1) { grid-column: 1 / -1; aspect-ratio: 21/9; }
        .card:nth-child(2) { grid-column: 1 / 7; aspect-ratio: 4/5; }
        .card:nth-child(3) { grid-column: 7 / -1; aspect-ratio: 1/1; margin-top: 10vw; }
        .card:nth-child(4) { grid-column: 1 / 5; aspect-ratio: 3/4; }
        .card:nth-child(5) { grid-column: 5 / -1; aspect-ratio: 16/9; }
        .card:nth-child(6) { grid-column: 2 / 8; aspect-ratio: 1/1; }
        .card:nth-child(7) { grid-column: 8 / -1; aspect-ratio: 4/5; margin-top: -5vw; }
        .card:nth-child(8) { grid-column: 1 / 9; aspect-ratio: 16/9; }
        .card:nth-child(9) { grid-column: 9 / -1; aspect-ratio: 3/4; }

        .card-img-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .card-img {
            width: 120%;
            height: 120%;
            object-fit: cover;
            position: absolute;
            top: -10%;
            left: -10%;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        /* Voile clair pour le contraste du texte */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(244, 243, 239, 0.9) 0%, rgba(244, 243, 239, 0) 50%);
            display: flex;
            align-items: flex-end;
            padding: 2.5rem;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--text-main);
            transform: translateY(20px);
            transition: transform 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* --- EFFETS DE SURVOL (HOVER) --- */
        .card:hover .card-img {
            transform: scale(1.05) translate(2%, 2%);
        }

        .card:hover .card-overlay {
            opacity: 1;
        }

        .card:hover .card-title {
            transform: translateY(0);
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 900px) {
            .portfolio-container { display: flex; flex-direction: column; gap: 5vw; }
            .card { aspect-ratio: 4/3 !important; margin-top: 0 !important; }
            .card-overlay { opacity: 1; background: linear-gradient(to top, rgba(244, 243, 239, 0.95) 0%, rgba(244, 243, 239, 0) 70%); }
            .card-title { transform: translateY(0); font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="hero-title">Selected <i>Works</i></h1>
        <p class="hero-subtitle">Exploration Visuelle</p>
    </header>

    <main class="portfolio-container">
        <!-- Les catégories et images exactes du document source -->
        
        <div class="card">
            <div class="card-img-wrapper">
                <img class="card-img parallax-img" src="images/DÖD.jpg" alt="Courts-Métrages">
            </div>
            <div class="card-overlay"><h2 class="card-title">Courts-Métrages</h2></div>
        </div>

        <div class="card">
            <div class="card-img-wrapper">
                <img class="card-img parallax-img" src="images/portrait1.jpg" alt="Portraits">
            </div>
            <div class="card-overlay"><h2 class="card-title">Portraits</h2></div>
        </div>

        <div class="card">
            <div class="card-img-wrapper">
                <img class="card-img parallax-img" src="images/nb3.jpg" alt="Noir & Blanc">
            </div>
            <div class="card-overlay"><h2 class="card-title">Noir & Blanc</h2></div>
        </div>

        <div class="card">
            <div class="card-img-wrapper">
                <img class="card-img parallax-img" src="images/archi4.jpg" alt="Architecture">
            </div>
            <div class="card-overlay"><h2 class="card-title">Architecture</h2></div>
        </div>

        <div class="card">
            <div class="card-img-wrapper">
                <img class="card-img parallax-img" src="images/street1.jpg" alt="Street & Reportage">
            </div>
            <div class="card-overlay"><h2 class="card-title">Street & Reportage</h2></div>
        </div>

        <div class="card">
            <div class="card-img-wrapper">
                <img class="card-img parallax-img" src="images/flou8.jpg" alt="Pose Longue">
            </div>
            <div class="card-overlay"><h2 class="card-title">Pose Longue</h2></div>
        </div>

        <div class="card">
            <div class="card-img-wrapper">
                <img class="card-img parallax-img" src="images/nature9.jpg" alt="Nature & Urbex">
            </div>
            <div class="card-overlay"><h2 class="card-title">Nature & Urbex</h2></div>
        </div>

        <div class="card">
            <div class="card-img-wrapper">
                <img class="card-img parallax-img" src="images/drone1.jpg" alt="Drone">
            </div>
            <div class="card-overlay"><h2 class="card-title">Drone</h2></div>
        </div>

        <div class="card">
            <div class="card-img-wrapper">
                <img class="card-img parallax-img" src="https://img.youtube.com/vi/N5z96sImUpc/maxresdefault.jpg" alt="Montages Variés">
            </div>
            <div class="card-overlay"><h2 class="card-title">Montages Variés</h2></div>
        </div>

    </main>

    <script>
        // Effet d'apparition au défilement (Scroll Reveal)
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.15
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.card').forEach(card => {
            observer.observe(card);
        });

        // Effet de parallaxe sur les images au scroll
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const parallaxImages = document.querySelectorAll('.parallax-img');
            
            parallaxImages.forEach(img => {
                const speed = 0.05;
                const rect = img.parentElement.getBoundingClientRect();
                
                // Active le parallaxe uniquement si l'image est dans le viewport
                if(rect.top < window.innerHeight && rect.bottom > 0) {
                    const yPos = -(rect.top * speed);
                    img.style.transform = `translate3d(0, ${yPos}px, 0)`;
                }
            });
        });
    </script>
</body>
</html>
