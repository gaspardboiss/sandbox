<!DOCTYPE HTML>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="description" content="Portfolio audiovisuel de Gaspard Boissinot : vidéo, montage, photographie, drone et post-production.">
    <title>Gaspard Boissinot — Portfolio</title>
    <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0e0e0e">
    <link rel="apple-touch-icon" href="images/icon-192.png">

    <!-- Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #08090d;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* --- HALO AMBIANT FUTURISTE EN FOND --- */
        body::before, body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            top: 20%;
            left: -100px;
            background: #00d2ff;
        }

        body::after {
            bottom: 20%;
            right: -100px;
            background: #9d00ff;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* --- HERO SECTION PARALLAXE --- */
        .hero {
            position: relative;
            height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            transform: translateZ(0);
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/Voiture noire.png');
            background-size: cover;
            background-position: center;
            filter: brightness(0.5) contrast(1.1);
            z-index: 1;
            will-change: transform;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            padding: 0 20px;
        }

        .hero-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a8c3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,255,255,0.2);
        }

        .hero-subtitle {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 4px;
            font-weight: 400;
            text-transform: uppercase;
        }

        /* --- NAVIGATION GLASSMORPHISME & FLOU --- */
        .navbar {
            position: sticky;
            top: 0;
            background: rgba(10, 12, 18, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 40px;
            will-change: transform;
            transform: translateZ(0);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }
